<body>


<!-- =================================
     HEADER
================================= -->

<header>

    <h1>🔧 Electronics AI</h1>

    <p>
        AI-powered electronics component detection
    </p>

</header>


<div class="container">


    <!-- =================================
         CAMERA + UPLOAD
    ================================= -->

    <div class="input-section">


        <!-- CAMERA -->

        <div class="box">

            <h2>📷 Camera Detection</h2>

            <video
                id="camera"
                autoplay
                playsinline>
            </video>

            <br>

            <button
                id="startCamera">

                📷 Start Camera

            </button>

            <button
                id="cameraDetect"
                disabled>

                🔍 Detect

            </button>

        </div>


        <!-- IMAGE UPLOAD -->

        <div class="box">

            <h2>🖼️ Upload Picture</h2>

            <img
                id="preview"
                alt="Selected image">

            <input
                type="file"
                id="imageInput"
                accept="image/*">

            <br>

            <button
                id="imageDetect"
                disabled>

                🔍 Detect Picture

            </button>

        </div>


    </div>


    <!-- =================================
         STATUS
    ================================= -->

    <p id="status">

        Select an image or start the camera.

    </p>


    <!-- =================================
         RESULTS
    ================================= -->

    <div id="results">

        <h2>🤖 Detection Results</h2>

        <div id="detections">

            <p>
                No detection yet.
            </p>

        </div>

    </div>


</div>


<footer>

    Electronics AI • YOLO11 Electronics Detection

</footer>


<!-- Hidden canvas -->

<canvas
    id="canvas"
    style="display:none;">
</canvas>


<script>


// =====================================================
// RENDER BACKEND
// =====================================================

const API_URL =
    "https://electronics-ai-1.onrender.com/predict";


// =====================================================
// GET ELEMENTS
// =====================================================

const camera =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const startCamera =
    document.getElementById("startCamera");

const cameraDetect =
    document.getElementById("cameraDetect");

const imageInput =
    document.getElementById("imageInput");

const imageDetect =
    document.getElementById("imageDetect");

const preview =
    document.getElementById("preview");

const status =
    document.getElementById("status");

const detections =
    document.getElementById("detections");


// =====================================================
// CAMERA STREAM
// =====================================================

let cameraStream = null;


// =====================================================
// START CAMERA
// =====================================================

startCamera.addEventListener(
    "click",
    async function () {

        try {

            status.className =
                "loading";

            status.textContent =
                "Starting camera...";


            cameraStream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        }
                    },

                    audio: false

                });


            camera.srcObject =
                cameraStream;


            cameraDetect.disabled =
                false;


            status.className =
                "success";

            status.textContent =
                "Camera started successfully.";

        }

        catch (error) {

            console.error(
                "Camera error:",
                error
            );


            status.className =
                "error";

            status.textContent =
                "Camera error: " +
                error.message;

        }

    }
);


// =====================================================
// IMAGE SELECTION
// =====================================================

imageInput.addEventListener(
    "change",
    function () {

        const file =
            imageInput.files[0];


        if (!file) {

            imageDetect.disabled =
                true;

            return;

        }


        // Check image type

        if (!file.type.startsWith("image/")) {

            status.className =
                "error";

            status.textContent =
                "Please select an image file.";

            imageDetect.disabled =
                true;

            return;

        }


        // Create preview

        const imageURL =
            URL.createObjectURL(file);


        preview.src =
            imageURL;


        preview.style.display =
            "block";


        imageDetect.disabled =
            false;


        status.className =
            "";

        status.textContent =
            "Image selected. Click Detect Picture.";

    }
);


// =====================================================
// IMAGE UPLOAD DETECTION
// =====================================================

imageDetect.addEventListener(
    "click",
    async function () {

        const file =
            imageInput.files[0];


        if (!file) {

            status.className =
                "error";

            status.textContent =
                "Please select an image first.";

            return;

        }


        imageDetect.disabled =
            true;


        status.className =
            "loading";

        status.textContent =
            "Uploading image to AI...";


        try {

            // Create FormData

            const formData =
                new FormData();


            formData.append(
                "image",
                file,
                file.name
            );


            console.log(
                "Sending image to:",
                API_URL
            );


            // Send to Render

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        body: formData

                    }
                );


            console.log(
                "HTTP status:",
                response.status
            );


            // Read response

            const data =
                await response.json();


            console.log(
                "Backend response:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Backend returned HTTP " +
                    response.status
                );

            }


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "AI prediction failed"
                );

            }


            // Show results

            showResults(
                data.detections
            );


        }

        catch (error) {

            console.error(
                "Prediction error:",
                error
            );


            status.className =
                "error";


            status.textContent =
                "Could not connect to AI backend: " +
                error.message;

        }

        finally {

            imageDetect.disabled =
                false;

        }

    }
);


// =====================================================
// CAMERA DETECTION
// =====================================================

cameraDetect.addEventListener(
    "click",
    async function () {

        if (!cameraStream) {

            status.className =
                "error";

            status.textContent =
                "Start the camera first.";

            return;

        }


        cameraDetect.disabled =
            true;


        status.className =
            "loading";

        status.textContent =
            "Capturing camera image...";


        try {

            // Wait for video dimensions

            if (
                camera.videoWidth === 0 ||
                camera.videoHeight === 0
            ) {

                throw new Error(
                    "Camera is not ready yet."
                );

            }


            canvas.width =
                camera.videoWidth;

            canvas.height =
                camera.videoHeight;


            const context =
                canvas.getContext("2d");


            context.drawImage(
                camera,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Convert camera frame to Blob

            const blob =
                await new Promise(
                    function (resolve) {

                        canvas.toBlob(
                            resolve,
                            "image/jpeg",
                            0.85
                        );

                    }
                );


            if (!blob) {

                throw new Error(
                    "Could not capture camera image."
                );

            }


            // FormData

            const formData =
                new FormData();


            formData.append(
                "image",
                blob,
                "camera.jpg"
            );


            status.textContent =
                "Sending camera image to AI...";


            // Send to backend

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        body: formData

                    }
                );


            const data =
                await response.json();


            console.log(
                "Camera response:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Backend returned HTTP " +
                    response.status
                );

            }


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "AI prediction failed"
                );

            }


            showResults(
                data.detections
            );


        }

        catch (error) {

            console.error(
                "Camera prediction error:",
                error
            );


            status.className =
                "error";


            status.textContent =
                "Detection failed: " +
                error.message;

        }

        finally {

            cameraDetect.disabled =
                false;

        }

    }
);


// =====================================================
// DISPLAY RESULTS
// =====================================================

function showResults(
    result
) {


    detections.innerHTML =
        "";


    // No detections

    if (
        !result ||
        result.length === 0
    ) {

        status.className =
            "";

        status.textContent =
            "No component detected.";


        detections.innerHTML = `
            <div class="result-card">

                <div class="component-name">
                    ❌ No component detected
                </div>

                <div class="confidence">
                    Try another image or move
                    closer to the component.
                </div>

            </div>
        `;

        return;

    }


    status.className =
        "success";


    status.textContent =
        result.length +
        " component(s) detected.";


    // Display every detection

    result.forEach(
        function (item) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "result-card";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "component-name";


            name.textContent =
                "🔧 " +
                item.class;


            const confidence =
                document.createElement(
                    "div"
                );


            confidence.className =
                "confidence";


            confidence.textContent =
                "Confidence: " +
                item.confidence +
                "%";


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "box-info";


            if (
                item.box &&
                item.box.length === 4
            ) {

                box.textContent =
                    "Bounding box: " +
                    item.box.join(", ");

            }


            card.appendChild(
                name
            );


            card.appendChild(
                confidence
            );


            card.appendChild(
                box
            );


            detections.appendChild(
                card
            );

        }
    );

}


// =====================================================
// TEST BACKEND CONNECTION
// =====================================================

console.log(
    "Electronics AI frontend loaded."
);

console.log(
    "Backend:",
    API_URL
);


</script>


</body>

</html>
