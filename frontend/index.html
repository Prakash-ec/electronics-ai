<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Electronics AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            text-align: center;

        header h1 {
            margin: 0;

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
            text-align: center;
        }

        .camera-box {
            background: #020617;

            border-radius: 15px;
        }

        video {
            width: 100%;

            padding: 14px 25px;

        }

        #startButton {
            background: #22c55e;

        #detectButton {
            background: #3b82f6;

        #detectButton:disabled {
            background: #64748b;

        }

        #results {
            margin-top: 25px;

            background: #1e293b;

        .component {

            margin-top: 5px;

        }

            color: #f87171;
        }

            color: #86efac;
        }

    </style>

</head>


<body>

<header>

    <h1>🔧 Electronics AI</h1>

    <p>
        AI-powered electronics component detection
    </p>

</header>


<div class="container">

    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

    </div>


    <button id="startButton">
        📷 Start Camera
    </button>


    <button
        id="detectButton"
        disabled>

        🔍 Detect Component

    </button>


    <div id="results">

        <h2>Detection Results</h2>

        <p id="status">
            Camera not started
        </p>

        <div id="detections"></div>

    </div>

</div>


<!-- Hidden canvas used to capture camera image -->

<canvas
    id="canvas"
    style="display:none;">
</canvas>


<script>

    // ==========================================
    // RENDER BACKEND
    // ==========================================

    const API_URL =
        "https://electronics-ai-1.onrender.com/predict";


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const startButton =
        document.getElementById("startButton");

    const detectButton =
        document.getElementById("detectButton");

    const status =
        document.getElementById("status");

    const detectionsDiv =
        document.getElementById("detections");


    let cameraStarted = false;


    // ==========================================
    // START CAMERA
    // ==========================================

    startButton.addEventListener(
        "click",
        async function () {

            try {

                status.className = "loading";

                status.textContent =
                    "Starting camera...";

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "environment"
                        },

                        audio: false

                    });


                video.srcObject = stream;

                cameraStarted = true;

                detectButton.disabled = false;

                status.className = "success";

                status.textContent =
                    "Camera ready. Point it at an electronics component.";

            }

            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                status.className = "error";

                status.textContent =
                    "Could not access camera. Please allow camera permission.";

            }

        }
    );


    // ==========================================
    // DETECT COMPONENT
    // ==========================================

    detectButton.addEventListener(
        "click",
        async function () {

            if (!cameraStarted) {

                status.textContent =
                    "Start the camera first.";

                return;

            }


            try {

                detectButton.disabled = true;

                status.className = "loading";

                status.textContent =
                    "AI is analyzing the image...";

                detectionsDiv.innerHTML = "";


                // ----------------------------------
                // Get video dimensions
                // ----------------------------------

                const width =
                    video.videoWidth;

                const height =
                    video.videoHeight;


                if (width === 0 || height === 0) {

                    throw new Error(
                        "Camera image is not ready"
                    );

                }


                // ----------------------------------
                // Draw current camera frame
                // ----------------------------------

                canvas.width = width;

                canvas.height = height;


                const context =
                    canvas.getContext("2d");


                context.drawImage(
                    video,
                    0,
                    0,
                    width,
                    height
                );


                // ----------------------------------
                // Convert image to JPEG
                // ----------------------------------

                const blob =
                    await new Promise(
                        resolve =>

                            canvas.toBlob(
                                resolve,
                                "image/jpeg",
                                0.85
                            )
                    );


                // ----------------------------------
                // Create form data
                // ----------------------------------

                const formData =
                    new FormData();

                formData.append(
                    "image",
                    blob,
                    "camera.jpg"
                );


                console.log(
                    "Sending image to:",
                    API_URL
                );


                // ----------------------------------
                // Send to Render
                // ----------------------------------

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                console.log(
                    "Response status:",
                    response.status
                );


                if (!response.ok) {

                    throw new Error(
                        "Backend returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "AI response:",
                    data
                );


                // ----------------------------------
                // Display results
                // ----------------------------------

                if (
                    !data.success &&
                    data.error
                ) {

                    throw new Error(
                        data.error
                    );

                }


                if (
                    !data.detections ||
                    data.detections.length === 0
                ) {

                    status.className = "";

                    status.textContent =
                        "No electronics component detected.";

                    return;

                }


                status.className =
                    "success";

                status.textContent =
                    data.detections.length +
                    " component(s) detected.";


                // ----------------------------------
                // Show each detection
                // ----------------------------------

                data.detections.forEach(
                    function (detection) {

                        const component =
                            document.createElement(
                                "div"
                            );

                        component.className =
                            "component";


                        const name =
                            document.createElement(
                                "div"
                            );

                        name.className =
                            "component-name";

                        name.textContent =
                            "🔧 " +
                            detection.class;


                        const confidence =
                            document.createElement(
                                "div"
                            );

                        confidence.className =
                            "confidence";

                        confidence.textContent =
                            "Confidence: " +
                            detection.confidence +
                            "%";


                        component.appendChild(
                            name
                        );

                        component.appendChild(
                            confidence
                        );


                        detectionsDiv.appendChild(
                            component
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "AI backend error:",
                    error
                );

                status.className =
                    "error";

                status.textContent =
                    "Could not connect to AI backend: " +
                    error.message;

            }

            finally {

                detectButton.disabled =
                    false;

            }

        }
    );

</script>


</body>

</html>
