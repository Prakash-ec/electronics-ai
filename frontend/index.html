```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Electronics AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    text-align: center;
    padding: 25px;
    background: #1e293b;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    color: #cbd5e1;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

/* Two columns */

.input-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* Camera and upload boxes */

.camera-box,
.upload-box {
    background: #020617;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    min-height: 350px;
}

.camera-box h2,
.upload-box h2 {
    margin-top: 0;
}

/* Camera */

video {
    width: 100%;
    max-height: 300px;
    border-radius: 12px;
    background: black;
}

/* Uploaded image */

#preview {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 12px;
    background: black;
    display: none;
}

/* File input */

input[type="file"] {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #1e293b;
    color: white;
    border-radius: 8px;
}

/* Buttons */

button {
    padding: 14px 25px;
    margin: 10px 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

#startButton {
    background: #22c55e;
    color: white;
}

#cameraDetectButton {
    background: #3b82f6;
    color: white;
}

#imageDetectButton {
    background: #a855f7;
    color: white;
}

button:disabled {
    background: #64748b !important;
    cursor: not-allowed;
}

/* Results */

#results {
    margin-top: 25px;
    padding: 20px;
    background: #1e293b;
    border-radius: 15px;
}

.component {
    padding: 15px;
    margin: 10px 0;
    background: #334155;
    border-radius: 10px;
}

.component-name {
    font-size: 20px;
    font-weight: bold;
}

.confidence {
    margin-top: 5px;
    color: #86efac;
}

#status {
    color: #cbd5e1;
}

.loading {
    color: #facc15 !important;
}

.error {
    color: #f87171 !important;
}

.success {
    color: #86efac !important;
}

/* Mobile */

@media (max-width: 700px) {

    .input-section {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 26px;
    }

}

</style>

</head>


<body>

<header>

<h1>🔧 Electronics AI</h1>

<p>
AI-powered electronics component detection
</p>

</header>


<div class="container">


<div class="input-section">


<!-- ========================= -->
<!-- CAMERA COLUMN -->
<!-- ========================= -->

<div class="camera-box">

<h2>📷 Camera</h2>

<video
    id="camera"
    autoplay
    playsinline>
</video>

<br>

<button id="startButton">
📷 Start Camera
</button>

<button
    id="cameraDetectButton"
    disabled>
🔍 Detect
</button>

</div>


<!-- ========================= -->
<!-- IMAGE UPLOAD COLUMN -->
<!-- ========================= -->

<div class="upload-box">

<h2>🖼️ Upload Picture</h2>

<img
    id="preview"
    alt="Selected image">

<input
    type="file"
    id="imageInput"
    accept="image/*">

<br>

<button
    id="imageDetectButton"
    disabled>
🔍 Detect Picture
</button>

</div>


</div>


<!-- ========================= -->
<!-- RESULTS -->
<!-- ========================= -->

<div id="results">

<h2>Detection Results</h2>

<p id="status">
Choose a camera or upload an image.
</p>

<div id="detections"></div>

</div>


</div>


<!-- Hidden canvas -->

<canvas
    id="canvas"
    style="display:none;">
</canvas>


<script>


// ==========================================
// RENDER BACKEND
// ==========================================

const API_URL =
    "https://electronics-ai-1.onrender.com/predict";


// ==========================================
// ELEMENTS
// ==========================================

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const startButton =
    document.getElementById("startButton");

const cameraDetectButton =
    document.getElementById(
        "cameraDetectButton"
    );

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const imageDetectButton =
    document.getElementById(
        "imageDetectButton"
    );

const status =
    document.getElementById("status");

const detectionsDiv =
    document.getElementById(
        "detections"
    );


// ==========================================
// START CAMERA
// ==========================================

startButton.addEventListener(
    "click",
    async function() {

        try {

            status.className =
                "loading";

            status.textContent =
                "Starting camera...";


            const stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode:
                            "environment"
                    },

                    audio: false

                });


            video.srcObject =
                stream;


            cameraDetectButton.disabled =
                false;


            status.className =
                "success";

            status.textContent =
                "Camera ready.";

        }

        catch(error) {

            console.error(
                "Camera error:",
                error
            );

            status.className =
                "error";

            status.textContent =
                "Could not access camera.";

        }

    }
);


// ==========================================
// IMAGE UPLOAD
// ==========================================

imageInput.addEventListener(
    "change",
    function() {

        const file =
            imageInput.files[0];


        if (!file) {

            return;

        }


        // Show image preview

        const imageURL =
            URL.createObjectURL(file);


        preview.src =
            imageURL;


        preview.style.display =
            "block";


        imageDetectButton.disabled =
            false;


        status.className =
            "";

        status.textContent =
            "Picture selected. Click Detect Picture.";

    }
);


// ==========================================
// CAMERA DETECTION
// ==========================================

cameraDetectButton.addEventListener(
    "click",
    async function() {

        try {

            cameraDetectButton.disabled =
                true;


            status.className =
                "loading";

            status.textContent =
                "AI is analyzing camera image...";


            const width =
                video.videoWidth;

            const height =
                video.videoHeight;


            canvas.width =
                width;

            canvas.height =
                height;


            const context =
                canvas.getContext("2d");


            context.drawImage(
                video,
                0,
                0,
                width,
                height
            );


            const blob =
                await new Promise(
                    resolve =>

                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.85
                    )
                );


            const formData =
                new FormData();


            formData.append(
                "image",
                blob,
                "camera.jpg"
            );


            await sendToAI(
                formData
            );

        }

        catch(error) {

            console.error(
                error
            );

            status.className =
                "error";

            status.textContent =
                "Camera detection failed.";

        }

        finally {

            cameraDetectButton.disabled =
                false;

        }

    }
);


// ==========================================
// UPLOADED IMAGE DETECTION
// ==========================================

imageDetectButton.addEventListener(
    "click",
    async function() {

        const file =
            imageInput.files[0];


        if (!file) {

            status.textContent =
                "Please select an image.";

            return;

        }


        try {

            imageDetectButton.disabled =
                true;


            status.className =
                "loading";

            status.textContent =
                "AI is analyzing your picture...";


            const formData =
                new FormData();


            formData.append(
                "image",
                file
            );


            await sendToAI(
                formData
            );

        }

        catch(error) {

            console.error(
                error
            );

            status.className =
                "error";

            status.textContent =
                "Image detection failed.";

        }

        finally {

            imageDetectButton.disabled =
                false;

        }

    }
);


// ==========================================
// SEND IMAGE TO YOLO
// ==========================================

async function sendToAI(
    formData
) {

    try {

        console.log(
            "Sending image to:",
            API_URL
        );


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


        console.log(
            "Response:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "Backend HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "AI result:",
            data
        );


        if (
            !data.success &&
            data.error
        ) {

            throw new Error(
                data.error
            );

        }


        displayResults(
            data.detections
        );

    }

    catch(error) {

        console.error(
            "Backend error:",
            error
        );

        status.className =
            "error";

        status.textContent =
            "Could not connect to AI backend: " +
            error.message;

    }

}


// ==========================================
// DISPLAY RESULTS
// ==========================================

function displayResults(
    detections
) {

    detectionsDiv.innerHTML =
        "";


    if (
        !detections ||
        detections.length === 0
    ) {

        status.className =
            "";

        status.textContent =
            "No electronics component detected.";

        return;

    }


    status.className =
        "success";

    status.textContent =
        detections.length +
        " component(s) detected.";


    detections.forEach(
        function(detection) {

            const component =
                document.createElement(
                    "div"
                );


            component.className =
                "component";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "component-name";


            name.textContent =
                "🔧 " +
                detection.class;


            const confidence =
                document.createElement(
                    "div"
                );


            confidence.className =
                "confidence";


            confidence.textContent =
                "Confidence: " +
                detection.confidence +
                "%";


            component.appendChild(
                name
            );

            component.appendChild(
                confidence
            );


            detectionsDiv.appendChild(
                component
            );

        }
    );

}

</script>

</body>

</html>
